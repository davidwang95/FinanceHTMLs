        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });

                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {

                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays

<body>
    <div id="root"></div>
    <script type="text/babel">
        // Initializing React root
        const { createRoot } = ReactDOM;
        const root = createRoot(document.getElementById('root'));

        // Defining the Dashboard component
        function Dashboard() {
            const [data, setData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            // Loading and parsing data
            React.useEffect(() => {
                const csvData = loadFileData("2025 Q1 Financial Info for Website (IR)_Final.xlsx");
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: false,
                    transformHeader: (header) => header.trim().replace(/^"|"$/g, ''),
                    transform: (value, header) => {
                        let cleaned = value.trim().replace(/^"|"$/g, '');
                        if (['2025', '2024', 'Change'].includes(header)) {
                            return isNaN(cleaned) || cleaned === '' ? cleaned : parseFloat(cleaned);
                        }
                        return cleaned;
                    },
                    complete: (results) => {
                        const cleanedData = results.data.filter(row => row['2025'] !== '' && row['2024'] !== '');
                        setData(cleanedData);
                        setLoading(false);
                    },
                    error: (err) => {
                        console.error(err);
                        setLoading(false);
                    }
                });
            }, []);

            if (loading) {

                { metric: 'Operating Profit', 2025: 1666, 2024: 1613 },

            // Formatting numbers
            const formatNumber = (num) => {
                if (num === null || isNaN(num)) return 'N/A';
                if (Math.abs(num) >= 1000) {
                    return `$${Math.abs(num) / 1000}B`;
                }
                return `$${num}M`;
            };

            const formatPercent = (num) => {
                if (num === null || isNaN(num)) return 'N/A';
                return `${num}%`;
            };

            return (
                <div className="container mx-auto p-4">
                    <h1 className="text-3xl font-bold mb-4 text-center">UPS Q1 2025 Financial Dashboard</h1>
                    <div className="grid grid-cols-2 gap-4">
                        {/* Rendering Stacked Area Chart */}
                        <div className="rounded-card bg-white p-4">
                            <h2 className="chart-title font-bold">Revenue by Segment</h2>
                            <p className="text-sm mb-2">Revenue trends across business segments for Q1 2025 vs. Q1 2024.</p>
                            <Recharts.ResponsiveContainer width="100%" height={300}>
                                <Recharts.AreaChart data={revenueData}>
                                    <Recharts.CartesianGrid stroke="#E5E5E5" strokeDasharray="3 3" />
                                    <Recharts.XAxis dataKey="segment" tick={{ fontSize: 12 }} />
                                    <Recharts.YAxis tickFormatter={formatNumber} tick={{ fontSize: 12 }} />
                                    <Recharts.Tooltip formatter={formatNumber} />
                                    <Recharts.Legend wrapperStyle={{ fontSize: '11px' }} />
                                    <Recharts.Area type="monotone" dataKey="2025" stackId="1" stroke="#7399C6" fill="#7399C6" />
                                    <Recharts.Area type="monotone" dataKey="2024" stackId="1" stroke="#ACD4F1" fill="#ACD4F1" />
                                </Recharts.AreaChart>
                            </Recharts.ResponsiveContainer>
                        </div>

                        {/* Rendering Grouped Bar Chart */}
                        <div className="rounded-card bg-white p-4">
                            <h2 className="chart-title font-bold">Key Financial Metrics</h2>
                            <p className="text-sm mb-2">Comparison of key financial metrics for Q1 2025 vs. Q1 2024.</p>
                            <Recharts.ResponsiveContainer width="100%" height={300}>
                                <Recharts.BarChart data={comparisonData}>
                                    <Recharts.CartesianGrid stroke="#E5E5E5" strokeDasharray="3 3" />
                                    <Recharts.XAxis dataKey="metric" tick={{ fontSize: 12 }} />
                                    <Recharts.YAxis tickFormatter={formatNumber} tick={{ fontSize: 12 }} />
                                    <Recharts.Tooltip formatter={formatNumber} />
                                    <Recharts.Legend wrapperStyle={{ fontSize: '11px' }} />
                                    <Recharts.Bar dataKey="2025" fill="#7399C6" />
                                    <Recharts.Bar dataKey="2024" fill="#ACD4F1" />
                                </Recharts.BarChart>
                            </Recharts.ResponsiveContainer>
                        </div>

                        {/* Rendering Waterfall Chart */}
                        <div className="rounded-card bg-white p-4">
                            <h2 className="chart-title font-bold">Cash Flow Bridge</h2>
                            <p className="text-sm mb-2">Cash flow changes from Net Income to Ending Cash for Q1 2025.</p>
                            <Recharts.ResponsiveContainer width="100%" height={300}>
                                <Recharts.BarChart data={cashFlowData}>
                                    <Recharts.CartesianGrid stroke="#E5E5E5" strokeDasharray="3 3" />
                                    <Recharts.XAxis dataKey="category" tick={{ fontSize: 12 }} />
                                    <Recharts.YAxis tickFormatter={formatNumber} tick={{ fontSize: 12 }} />
                                    <Recharts.Tooltip formatter={formatNumber} />
                                    <Recharts.Bar dataKey="value" fill="#7399C6">
                                        {cashFlowData.map((entry, index) => (
                                            <Recharts.Cell key={`cell-${index}`} fill={entry.value >= 0 ? '#7399C6' : '#00355F'} />
                                        ))}
                                    </Recharts.Bar>
                                </Recharts.BarChart>
                            </Recharts.ResponsiveContainer>
                        </div>

                        {/* Rendering Donut Chart */}
                        <div className="rounded-card bg-white p-4">
                            <h2 className="chart-title font-bold">Revenue Mix by Geography</h2>
                            <p className="text-sm mb-2">Geographic revenue distribution for Q1 2025.</p>
                            <Recharts.ResponsiveContainer width="100%" height={300}>
                                <Recharts.PieChart>
                                    <Recharts.Pie
                                        data={revenueMixData}
                                        dataKey="value"
                                        nameKey="name"
                                        cx="50%"
                                        cy="50%"
                                        innerRadius={60}
                                        outerRadius={100}
                                        fill="#7399C6"
                                        label
                                    >
                                        {revenueMixData.map((entry, index) => (
                                            <Recharts.Cell key={`cell-${index}`} fill={index % 2 === 0 ? '#7399C6' : '#ACD4F1'} />
                                        ))}
                                    </Recharts.Pie>
                                    <Recharts.Tooltip formatter={formatNumber} />
                                    <Recharts.Legend wrapperStyle={{ fontSize: '11px' }} />
                                </Recharts.PieChart>
                            </Recharts.ResponsiveContainer>
                        </div>

                        {/* Rendering KPI Cards */}
                        <div className="rounded-card bg-white p-4 col-span-2">
                            <h2 className="chart-title font-bold">Key Performance Indicators</h2>
                            <p className="text-sm mb-2">Key metrics with year-over-year changes for Q1 2025.</p>
                            <div className="flex justify-around">
                                {kpiData.map((kpi, index) => (
                                    <div key={index} className="text-center">
                                        <div className="kpi-number font-bold">{kpi.name === 'EPS' ? `$${kpi.value}` : formatPercent(kpi.value)}</div>

                                        <div className="text-sm">{kpi.delta !== null ? `${kpi.delta > 0 ? '+' : ''}${kpi.name === 'EPS' ? '$' : ''}${kpi.delta}${kpi.name !== 'EPS' ? '%' : ''} YoY` : 'N/A'}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Rendering the Dashboard component
        root.render(<Dashboard />);
    </script>
